services:
  - type: web
    name: giuaki-dientoandammay-23it102
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MSSV
        value: 23IT102
      - key: FULL_NAME
        value: Le Nhat Huy
      - key: CLASS_NAME
        value: 23SE2
      - key: MONGODB_READ_URI
        sync: false
      - key: MONGODB_WRITE_URI
        sync: false
      - key: MONGODB_SESSION_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
